<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Notice Board - Beaches TCI</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#0a3d62;--primary-light:#1e5f8a;--accent:#00d4ff;--accent-glow:rgba(0,212,255,0.5);--warning:#f39c12;--danger:#e74c3c;--success:#00b894;--bg-dark:#050510;--bg-card:#0d1526;--bg-card-light:#162033;--text-primary:#fff;--text-secondary:#a0b0c0;--food:#f39c12;--beverage:#9b59b6;--water:#3498db;--general:#1abc9c;--projects:#e74c3c;--nb-gold:#FFB703;--nb-coral:#E29578}
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'DM Sans',sans-serif;background:var(--bg-dark);min-height:100vh;color:var(--text-primary);overflow:hidden}
        .slides-wrapper{position:relative;height:100vh}.slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;visibility:hidden;transition:opacity 2s ease-in-out;display:flex;flex-direction:column}.slide.active{opacity:1;visibility:visible}
        
        /* HEADER - BIGGER */
        .nb-header{background:linear-gradient(135deg,var(--primary),var(--primary-light));padding:1rem 2.5rem;display:flex;justify-content:space-between;align-items:center;border-bottom:5px solid var(--accent);box-shadow:0 0 50px var(--accent-glow)}
        .nb-logo{display:flex;align-items:center;gap:1.2rem}.nb-logo-icon{width:70px;height:70px;background:linear-gradient(135deg,var(--accent),#0088aa);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;box-shadow:0 0 30px var(--accent-glow)}
        .nb-logo-text h1{font-size:2.2rem;font-weight:800}.nb-logo-text span{font-size:1rem;color:var(--accent);letter-spacing:4px;font-family:'Space Mono',monospace}
        .header-info{display:flex;align-items:center;gap:2.5rem}.weather-box{display:flex;align-items:center;gap:1rem;background:rgba(255,255,255,0.1);padding:0.8rem 1.5rem;border-radius:30px}.weather-icon{font-size:2.5rem}.weather-temp{font-size:2rem;font-weight:700}.weather-desc{font-size:1rem;opacity:0.9}
        .datetime-box{text-align:right}.current-time{font-size:3.5rem;font-weight:800;font-family:'Orbitron',monospace;color:var(--accent);text-shadow:0 0 25px var(--accent-glow)}.current-date{font-size:1.3rem;opacity:0.9}
        
        /* SLIDE BODY - BIGGER */
        .slide-body{flex:1;padding:1.5rem 2.5rem;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#0d1b2a 0%,var(--bg-dark) 100%);overflow:hidden}
        .slide-title-bar{display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;opacity:0;animation:fadeInUp 1.2s ease forwards}.slide-icon{width:80px;height:80px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:3rem;box-shadow:0 10px 30px rgba(0,0,0,0.4)}.slide-title{font-size:3.2rem;font-weight:800;text-shadow:0 4px 20px rgba(0,0,0,0.4)}
        .slide-content{flex:1;overflow:hidden}
        
        /* CARDS - BIGGER FOR NOTICE BOARD WITH FADE */
        .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:1.8rem}
        .card{background:linear-gradient(145deg,var(--bg-card),var(--bg-card-light));border-radius:20px;padding:2rem;border-left:6px solid var(--accent);opacity:0;animation:fadeInUp 1.5s ease forwards}
        @keyframes fadeInUp{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
        .card:nth-child(1){animation-delay:0.2s}.card:nth-child(2){animation-delay:0.5s}.card:nth-child(3){animation-delay:0.8s}.card:nth-child(4){animation-delay:1.1s}.card:nth-child(5){animation-delay:1.4s}.card:nth-child(6){animation-delay:1.7s}
        .card-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:1.2rem}.card-photo{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid var(--accent)}
        .card-photo-placeholder{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--nb-coral));display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:700}
        .card-photo-emoji{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#FFE066,#FFB347);display:flex;align-items:center;justify-content:center;font-size:4rem;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
        .card-title{font-size:2.2rem;font-weight:700}.card-subtitle{font-size:1.5rem;color:var(--accent)}.card-body{font-size:1.6rem;color:var(--text-secondary);line-height:1.6}
        .card-meta{display:flex;gap:1.5rem;margin-top:1.2rem;font-size:1.3rem;color:var(--text-secondary);flex-wrap:wrap}.card-meta span{display:flex;align-items:center;gap:0.5rem}
        .card.urgent{border-left-color:var(--danger);animation:pulse-urgent 2s infinite}@keyframes pulse-urgent{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0)}50%{box-shadow:0 0 30px 10px rgba(231,76,60,0.4)}}
        
        /* BIRTHDAY CARDS */
        .birthday-card{border-left-color:var(--nb-gold);position:relative;overflow:hidden}.birthday-card.today{border:6px solid var(--nb-gold);animation:birthday-glow 1.5s infinite;background:linear-gradient(145deg,#3d2b00,#1a1200)}
        .birthday-card.today::before{content:'🎉';position:absolute;top:15px;right:15px;font-size:4rem;animation:bounce 1s infinite}.birthday-card.today::after{content:'🎈';position:absolute;bottom:15px;right:60px;font-size:3rem;animation:float 2s infinite}
        .birthday-card .card-photo,.birthday-card .card-photo-placeholder{width:180px;height:180px;font-size:3.5rem}
        .birthday-card .card-photo-emoji{width:180px;height:180px;font-size:5.5rem}
        .birthday-card .card-photo{border:6px solid var(--nb-gold);box-shadow:0 0 30px rgba(255,183,3,0.5)}
        .birthday-card .card-title{font-size:2.5rem;color:var(--nb-gold)}
        .birthday-card .card-subtitle{font-size:1.5rem}
        .birthday-card .birthday-date{font-size:2rem;color:var(--nb-gold);padding:1.5rem;text-align:center;font-weight:800}
        @keyframes birthday-glow{0%,100%{box-shadow:0 0 30px rgba(255,183,3,0.6)}50%{box-shadow:0 0 60px rgba(255,183,3,0.9)}}
        @keyframes confetti{0%{transform:translateY(-100%) rotate(0deg)}100%{transform:translateY(100vh) rotate(720deg)}}
        .birthday-bg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:0}
        .confetti{position:absolute;width:15px;height:15px;animation:confetti 4s linear infinite;font-size:2rem}
        .birthday-celebration{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
        .birthday-headline{font-size:5rem;color:var(--nb-gold);text-shadow:0 0 40px rgba(255,183,3,0.8),0 0 80px rgba(255,183,3,0.4);animation:pulse 2s infinite;margin-bottom:2rem;font-family:'Orbitron',monospace}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        .birthday-cards-wrapper{display:flex;gap:3rem;justify-content:center;flex-wrap:wrap}
        .birthday-spotlight{background:linear-gradient(145deg,rgba(255,183,3,0.2),rgba(255,183,3,0.05));border:4px solid var(--nb-gold);border-radius:30px;padding:3rem;animation:birthday-glow 2s infinite;min-width:350px}
        .birthday-photo-frame{width:200px;height:200px;margin:0 auto 1.5rem;border-radius:50%;overflow:hidden;border:6px solid var(--nb-gold);box-shadow:0 0 40px rgba(255,183,3,0.6)}
        .birthday-photo{width:100%;height:100%;object-fit:cover}
        .birthday-initials{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4rem;font-weight:800;background:linear-gradient(145deg,#FFD700,#FFA500);color:#1a1a2e}
        .birthday-name{font-size:2.8rem;font-weight:800;color:var(--nb-gold);margin-bottom:0.5rem;text-shadow:0 0 20px rgba(255,183,3,0.5)}
        .birthday-title{font-size:1.6rem;color:var(--text-secondary);margin-bottom:1rem}
        .birthday-wish{font-size:1.8rem;color:white;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
        .birthday-date{font-size:1.8rem;color:var(--nb-gold);font-weight:800;margin-top:0.8rem;display:flex;align-items:center;gap:0.5rem}
        @keyframes birthday-glow{0%,100%{box-shadow:0 0 30px rgba(255,183,3,0.4)}50%{box-shadow:0 0 60px rgba(255,183,3,0.7)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-20px) rotate(5deg)}}
        
        /* OCCUPANCY - BIGGER & VIBRANT */
        .occupancy-grid{display:grid;grid-template-columns:1fr 2fr;gap:3rem;height:100%;align-items:center}.gauge-container{display:flex;justify-content:center}
        .gauge{width:450px;height:450px;border-radius:50%;background:conic-gradient(var(--success) calc(var(--pct)*1%),rgba(255,255,255,0.1) calc(var(--pct)*1%));display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(0,184,148,0.5)}
        .gauge-inner{width:380px;height:380px;border-radius:50%;background:var(--bg-card);display:flex;flex-direction:column;align-items:center;justify-content:center}.gauge-value{font-size:5.5rem;font-weight:900;color:var(--success);font-family:'Orbitron',monospace;text-shadow:0 0 40px rgba(0,184,148,0.8)}.gauge-label{font-size:2rem;color:var(--text-secondary);font-weight:700}
        .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem}
        .stat-card{background:var(--bg-card);border-radius:16px;padding:1.8rem;text-align:center;border-top:5px solid var(--accent)}
        .stat-card.arrivals{border-top-color:#2ecc71;background:linear-gradient(145deg,rgba(46,204,113,0.15),var(--bg-card))}.stat-card.arrivals .stat-value{color:#2ecc71}
        .stat-card.departures{border-top-color:#e74c3c;background:linear-gradient(145deg,rgba(231,76,60,0.15),var(--bg-card))}.stat-card.departures .stat-value{color:#e74c3c}
        .stat-card.adults{border-top-color:#3498db;background:linear-gradient(145deg,rgba(52,152,219,0.15),var(--bg-card))}.stat-card.adults .stat-value{color:#3498db}
        .stat-card.children{border-top-color:#f39c12;background:linear-gradient(145deg,rgba(243,156,18,0.15),var(--bg-card))}.stat-card.children .stat-value{color:#f39c12}
        .stat-card.total{border-top-color:var(--nb-gold);background:linear-gradient(145deg,rgba(255,183,3,0.2),var(--bg-card))}.stat-card.total .stat-value{color:var(--nb-gold);text-shadow:0 0 20px rgba(255,183,3,0.5)}
        .stat-value{font-size:3.5rem;font-weight:800;font-family:'Orbitron',monospace}.stat-label{font-size:1.3rem;color:var(--text-secondary);margin-top:0.3rem}
        
        /* F&B PERFORMANCE - BIGGER & VIBRANT */
        .fb-container{display:flex;flex-direction:column;height:100%;gap:1.2rem}
        .fb-driver{background:linear-gradient(135deg,rgba(0,212,255,0.3),rgba(0,212,255,0.1));border-radius:16px;padding:1.5rem 3rem;display:flex;justify-content:center;gap:6rem;border:4px solid var(--accent);box-shadow:0 0 40px rgba(0,212,255,0.3)}
        .driver-item{text-align:center}.driver-value{font-size:4.5rem;font-weight:900;font-family:'Orbitron',monospace;text-shadow:0 0 30px rgba(0,212,255,0.6)}.driver-label{font-size:1.4rem;color:var(--text-secondary);font-weight:600}
        .driver-item.today .driver-value{color:#00d4ff}.driver-item.mtd .driver-value{color:#FFB703}
        .fb-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2rem}
        .fb-section{background:linear-gradient(145deg,var(--bg-card),var(--bg-card-light));border-radius:20px;padding:1.5rem;position:relative;overflow:hidden}
        .fb-section.food{border-top:6px solid var(--food)}.fb-section.food::before{content:'🍽️';position:absolute;top:15px;right:20px;font-size:4rem;opacity:0.15}
        .fb-section.beverage{border-top:6px solid var(--beverage)}.fb-section.beverage::before{content:'🍷';position:absolute;top:15px;right:20px;font-size:4rem;opacity:0.15}
        .fb-title{font-size:2.5rem;font-weight:800;margin-bottom:1rem;display:flex;align-items:center;gap:0.6rem}
        .fb-section.food .fb-title{color:var(--food)}.fb-section.beverage .fb-title{color:var(--beverage)}
        .fb-row{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-bottom:1rem}
        .fb-block{background:rgba(0,0,0,0.4);border-radius:12px;padding:1rem}
        .fb-block.today-block{border-left:4px solid #00d4ff}.fb-block.mtd-block{border-left:4px solid #FFB703}
        .fb-block-title{font-size:1.3rem;color:var(--text-secondary);margin-bottom:0.6rem;text-transform:uppercase;letter-spacing:2px;font-weight:700}
        .fb-block.today-block .fb-block-title{color:#00d4ff}.fb-block.mtd-block .fb-block-title{color:#FFB703}
        .fb-table{width:100%}.fb-table td{padding:0.5rem 0;font-size:1.5rem}.fb-table td:first-child{color:var(--text-secondary);font-weight:600}.fb-table td:nth-child(2){text-align:right;font-family:'Space Mono',monospace;font-weight:700;font-size:1.6rem}
        .fb-table .variance.positive{color:var(--success)}.fb-table .variance.negative{color:var(--danger)}
        
        /* UTILITY - BIGGER & VIBRANT */
        .utility-container{display:flex;flex-direction:column;height:100%;gap:1.2rem}
        .utility-driver{background:linear-gradient(135deg,rgba(52,152,219,0.3),rgba(52,152,219,0.1));border-radius:16px;padding:1.5rem 3rem;display:flex;justify-content:center;gap:6rem;border:4px solid var(--water);box-shadow:0 0 40px rgba(52,152,219,0.3)}
        .utility-driver .driver-value{color:var(--water);text-shadow:0 0 30px rgba(52,152,219,0.6)}
        .utility-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
        .utility-card{background:linear-gradient(145deg,var(--bg-card),var(--bg-card-light));border-radius:18px;padding:1.5rem;text-align:center;position:relative;overflow:hidden}
        .utility-card.water{border-top:6px solid #3498db}.utility-card.water .utility-icon{color:#3498db}
        .utility-card.electricity{border-top:6px solid #f1c40f}.utility-card.electricity .utility-icon{color:#f1c40f}
        .utility-card.propane{border-top:6px solid #e67e22}.utility-card.propane .utility-icon{color:#e67e22}
        .utility-card.diesel{border-top:6px solid #95a5a6}.utility-card.diesel .utility-icon{color:#95a5a6}
        .utility-icon{font-size:3.5rem;margin-bottom:0.5rem}.utility-name{font-size:1.6rem;font-weight:800;margin-bottom:1rem}
        .utility-stats{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;text-align:left}
        .utility-stat{background:rgba(0,0,0,0.4);border-radius:10px;padding:0.8rem}
        .utility-stat.today-stat{border-left:4px solid #00d4ff}.utility-stat.mtd-stat{border-left:4px solid #FFB703}
        .utility-stat-label{font-size:1.1rem;color:var(--text-secondary);text-transform:uppercase;font-weight:700}
        .utility-stat.today-stat .utility-stat-label{color:#00d4ff}.utility-stat.mtd-stat .utility-stat-label{color:#FFB703}
        .utility-stat-value{font-size:1.7rem;font-weight:800;font-family:'Space Mono',monospace}.utility-stat-sub{font-size:1.2rem;color:var(--accent);font-weight:600}
        
        /* KPI - UPGRADED & VIBRANT */
        .kpi-container{display:flex;flex-direction:column;height:100%;gap:1.2rem}
        .kpi-summary{background:linear-gradient(135deg,rgba(155,89,182,0.2),rgba(231,76,60,0.1));border-radius:18px;padding:2rem;display:flex;justify-content:space-between;align-items:center;border:3px solid rgba(155,89,182,0.5)}
        .kpi-summary-left h3{font-size:2.2rem;margin-bottom:0.4rem;color:var(--nb-gold)}.kpi-summary-left p{color:var(--text-secondary);font-size:1.4rem}
        .kpi-score{text-align:center;padding:1.5rem 2.5rem;border-radius:16px}.kpi-score-value{font-size:5.5rem;font-weight:900;font-family:'Orbitron',monospace}.kpi-score-label{font-size:1.5rem;color:var(--text-secondary);font-weight:600}
        .kpi-score.good{background:linear-gradient(135deg,rgba(0,184,148,0.3),rgba(0,184,148,0.1));border:3px solid var(--success)}.kpi-score.good .kpi-score-value{color:var(--success);text-shadow:0 0 30px rgba(0,184,148,0.6)}
        .kpi-score.warning{background:linear-gradient(135deg,rgba(243,156,18,0.3),rgba(243,156,18,0.1));border:3px solid var(--warning)}.kpi-score.warning .kpi-score-value{color:var(--warning);text-shadow:0 0 30px rgba(243,156,18,0.6)}
        .kpi-score.danger{background:linear-gradient(135deg,rgba(231,76,60,0.3),rgba(231,76,60,0.1));border:3px solid var(--danger)}.kpi-score.danger .kpi-score-value{color:var(--danger);text-shadow:0 0 30px rgba(231,76,60,0.6)}
        .kpi-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:1.2rem}
        .kpi-card{background:linear-gradient(145deg,var(--bg-card),var(--bg-card-light));border-radius:14px;padding:1.5rem;display:flex;align-items:center;gap:1.5rem;border:2px solid rgba(255,255,255,0.1)}
        .kpi-status{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem}
        .kpi-status.met{background:rgba(0,184,148,0.3);border:5px solid var(--success);box-shadow:0 0 25px rgba(0,184,148,0.4)}.kpi-status.not-met{background:rgba(231,76,60,0.3);border:5px solid var(--danger);box-shadow:0 0 25px rgba(231,76,60,0.4)}
        .kpi-info{flex:1}.kpi-name{font-size:1.7rem;font-weight:700;margin-bottom:0.5rem}.kpi-values{display:flex;gap:2rem;font-size:1.3rem;color:var(--text-secondary);font-weight:500}
        .kpi-values span{display:flex;align-items:center;gap:0.4rem}
        
        /* AWARDS - BIGGER */
        .award-card{background:linear-gradient(145deg,#1a1a2e,#2d2d44);border-radius:20px;padding:2rem;border:3px solid var(--nb-gold);position:relative;overflow:hidden;opacity:0;animation:fadeInUp 1.5s ease forwards}
        .award-card:nth-child(1){animation-delay:0.2s}.award-card:nth-child(2){animation-delay:0.5s}.award-card:nth-child(3){animation-delay:0.8s}.award-card:nth-child(4){animation-delay:1.1s}
        .award-card::before{content:'🏆';position:absolute;top:-10px;right:-10px;font-size:6rem;opacity:0.12}
        .award-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:5px solid var(--nb-gold);box-shadow:0 0 25px rgba(255,183,3,0.4)}
        .award-photo-placeholder{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--nb-gold),var(--nb-coral));display:flex;align-items:center;justify-content:center;font-size:3.5rem;font-weight:700}
        .award-name{font-size:2.4rem;font-weight:800;color:var(--nb-gold)}.award-title{font-size:1.5rem;color:var(--text-secondary)}.award-writeup{font-size:1.5rem;color:var(--text-primary);line-height:1.6;font-style:italic;margin-top:1.2rem}
        
        .commend-card{background:linear-gradient(145deg,#0d2818,#1a4d2e);border-left:6px solid var(--success)}.commend-card .card-title{color:var(--success)}
        
        /* ICONS */
        .icon-notices{background:linear-gradient(135deg,#e74c3c,#c0392b)}.icon-birthday{background:linear-gradient(135deg,var(--nb-coral),var(--nb-gold))}.icon-events{background:linear-gradient(135deg,var(--nb-gold),#f39c12)}.icon-dept-events{background:linear-gradient(135deg,#3498db,#2980b9)}
        .icon-training{background:linear-gradient(135deg,#27ae60,#2ecc71)}.icon-dept-training{background:linear-gradient(135deg,#1abc9c,#16a085)}.icon-hr{background:linear-gradient(135deg,#9b59b6,#8e44ad)}.icon-security{background:linear-gradient(135deg,#34495e,#2c3e50)}
        .icon-occupancy{background:linear-gradient(135deg,var(--success),#00cec9)}.icon-fb{background:linear-gradient(135deg,var(--food),var(--beverage))}.icon-utility{background:linear-gradient(135deg,#3498db,#2980b9)}.icon-kpi{background:linear-gradient(135deg,#9b59b6,#e74c3c)}
        .icon-awards{background:linear-gradient(135deg,var(--nb-gold),#e67e22)}.icon-commend{background:linear-gradient(135deg,#00b894,#55efc4)}.icon-dyk{background:linear-gradient(135deg,#3498db,#2980b9)}
        
        /* DID YOU KNOW - BIGGER */
        .dyk-container{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:2rem;opacity:0;animation:fadeInUp 2s ease forwards}
        .dyk-icon{font-size:8rem;margin-bottom:2.5rem;animation:float 3s ease-in-out infinite}
        .dyk-text{font-size:3.2rem;max-width:1200px;line-height:1.5;font-weight:500}
        .dyk-source{font-size:1.6rem;color:var(--text-secondary);margin-top:2.5rem;font-style:italic}
        
        /* EMPTY STATE */

        function renderKPI(){const el=document.getElementById('content-kpi');if(!allData.kpi?.length){el.innerHTML=empty('📊','No KPI data');return}const kpis=allData.kpi,met=kpis.filter(k=>k.met==='MET'||k.met==='TRUE').length,total=kpis.length,pct=Math.round((met/total)*100),scoreClass=pct>=80?'good':pct>=60?'warning':'danger';el.innerHTML=`<div class="kpi-container"><div class="kpi-summary"><div class="kpi-summary-left"><h3>📊 ${kpis[0]?.month||'Monthly'} Performance</h3><p>Previous month KPI results</p></div><div class="kpi-score ${scoreClass}"><div class="kpi-score-value">${met}/${total}</div><div class="kpi-score-label">Targets Met (${pct}%)</div></div></div><div class="kpi-grid">${kpis.map(k=>{const isMet=k.met==='MET'||k.met==='TRUE';return`<div class="kpi-card"><div class="kpi-status ${isMet?'met':'not-met'}">${isMet?'✅':'❌'}</div><div class="kpi-info"><div class="kpi-name">${k.kpiName||'KPI'}</div><div class="kpi-values"><span>🎯 Target: ${k.target}</span><span>📈 Result: ${k.result}</span></div></div></div>`}).join('')}</div></div>`}
        function renderAwards(){const el=document.getElementById('content-awards');if(!allData.awards?.length){el.innerHTML=empty('🏆','No nominees');return}el.innerHTML=`<div class="cards-grid">${allData.awards.map(a=>`<div class="award-card"><div class="card-header">${a.photoUrl?`<img src="${a.photoUrl}" class="award-photo">`:`<div class="award-photo-placeholder">${initials(a.name)}</div>`}<div><div class="award-name">${a.name||''}</div><div class="award-title">${a.jobTitle||''}</div></div></div><div class="award-writeup" style="font-size:1.5rem">"${a.writeup||''}"</div></div>`).join('')}</div>`}
        function renderCommend(){const el=document.getElementById('content-commend');if(!allData.commend?.length){el.innerHTML=empty('🌟','No commendations');return}el.innerHTML=`<div class="cards-grid">${allData.commend.map(c=>`<div class="card commend-card"><div class="card-header">${c.photoUrl?`<img src="${c.photoUrl}" class="card-photo">`:`<div class="card-photo-placeholder">${initials(c.name)}</div>`}<div><div class="card-title">${c.name||''}</div><div class="card-subtitle">${c.jobTitle||''}</div></div></div><div class="card-body" style="font-size:1.6rem">${c.message||''}</div></div>`).join('')}</div>`}
        function renderDYK(){const el=document.getElementById('content-dyk');if(!allData.dyk?.length){el.innerHTML=empty('💡','No facts');return}const f=allData.dyk[Math.floor(Math.random()*allData.dyk.length)];el.innerHTML=`<div class="dyk-container"><div class="dyk-icon">💡</div><div class="dyk-text">${f.fact||''}</div>${f.source?`<div class="dyk-source">— ${f.source}</div>`:''}</div>`}
        function empty(i,t){return`<div class="empty-state"><div class="empty-icon">${i}</div><div class="empty-text">${t}</div></div>`}
        function fmtDate(d){if(!d)return'-';const parts=d.split('-');if(parts.length===3){const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${months[parseInt(parts[1])-1]} ${parseInt(parts[2])}, ${parts[0]}`}return d}
        function fmtBday(d){if(!d)return'-';const parts=d.split('-');if(parts.length===3){const months=['January','February','March','April','May','June','July','August','September','October','November','December'];return`${months[parseInt(parts[1])-1]} ${parseInt(parts[2])}`}return d}
        function initials(n){return n?n.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2):'?'}
        function fmt(n){return n?Number(n).toLocaleString():'0'}
        function num(n){return parseFloat(n)||0}
        function money(n,showSign=false){const v=num(n);const s=showSign&&v>0?'+':'';return s+'$'+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}
    </script>
</body>
</html>
