        function renderUtility(){const el=document.getElementById('content-utility');if(!allData.utility?.length){el.innerHTML=empty('⚡','No data');return}const d=allData.utility[0];el.innerHTML=`<div class="utility-container"><div class="utility-driver"><div class="driver-item"><div class="driver-value">${fmt(d.roomsToday)}</div><div class="driver-label">Today's Rooms</div></div><div class="driver-item"><div class="driver-value">${fmt(d.roomsMtd)}</div><div class="driver-label">MTD Room Nights</div></div></div><div class="utility-grid"><div class="utility-card water"><div class="utility-icon">💧</div><div class="utility-name">WATER</div><div class="utility-stats"><div class="utility-stat"><div class="utility-stat-label">Today</div><div class="utility-stat-value">${fmt(d.waterToday)} L</div><div class="utility-stat-sub">${fmt(d.waterPerRoomToday)} L/room</div></div><div class="utility-stat"><div class="utility-stat-label">MTD</div><div class="utility-stat-value">${fmt(d.waterMtd)} L</div><div class="utility-stat-sub">${fmt(d.waterPerRoomMtd)} L/room</div></div></div></div><div class="utility-card electricity"><div class="utility-icon">⚡</div><div class="utility-name">ELECTRICITY</div><div class="utility-stats"><div class="utility-stat"><div class="utility-stat-label">Today</div><div class="utility-stat-value">${fmt(d.electricityToday)} kWh</div><div class="utility-stat-sub">${fmt(d.electricityPerRoomToday)} kWh/rm</div></div><div class="utility-stat"><div class="utility-stat-label">MTD</div><div class="utility-stat-value">${fmt(d.electricityMtd)} kWh</div><div class="utility-stat-sub">${fmt(d.electricityPerRoomMtd)} kWh/rm</div></div></div></div><div class="utility-card propane"><div class="utility-icon">🔥</div><div class="utility-name">PROPANE</div><div class="utility-stats"><div class="utility-stat"><div class="utility-stat-label">Today</div><div class="utility-stat-value">${fmt(d.propaneToday)} L</div><div class="utility-stat-sub">${fmt(d.propanePerRoomToday)} L/room</div></div><div class="utility-stat"><div class="utility-stat-label">MTD</div><div class="utility-stat-value">${fmt(d.propaneMtd)} L</div><div class="utility-stat-sub">${fmt(d.propanePerRoomMtd)} L/room</div></div></div></div><div class="utility-card diesel"><div class="utility-icon">⛽</div><div class="utility-name">DIESEL</div><div class="utility-stats"><div class="utility-stat"><div class="utility-stat-label">Today</div><div class="utility-stat-value">${fmt(d.dieselToday)} L</div><div class="utility-stat-sub">${fmt(d.dieselPerRoomToday)} L/room</div></div><div class="utility-stat"><div class="utility-stat-label">MTD</div><div class="utility-stat-value">${fmt(d.dieselMtd)} L</div><div class="utility-stat-sub">${fmt(d.dieselPerRoomMtd)} L/room</div></div></div></div></div></div>`}
        function renderKPI(){const el=document.getElementById('content-kpi');if(!allData.kpi?.length){el.innerHTML=empty('📊','No KPI data');return}const kpis=allData.kpi,met=kpis.filter(k=>k.met==='TRUE').length,total=kpis.length,pct=Math.round((met/total)*100),scoreClass=pct>=80?'good':pct>=60?'warning':'danger';el.innerHTML=`<div class="kpi-container"><div class="kpi-summary"><div class="kpi-summary-left"><h3>📊 ${kpis[0]?.month||'Monthly'} Performance</h3><p>Previous month KPI results</p></div><div class="kpi-score ${scoreClass}"><div class="kpi-score-value">${met}/${total}</div><div class="kpi-score-label">Targets Met (${pct}%)</div></div></div><div class="kpi-grid">${kpis.map(k=>`<div class="kpi-card"><div class="kpi-status ${k.met==='TRUE'?'met':'not-met'}">${k.met==='TRUE'?'✅':'❌'}</div><div class="kpi-info"><div class="kpi-name">${k.kpiName||'KPI'}</div><div class="kpi-values"><span>🎯 Target: ${k.target}</span><span>📈 Result: ${k.result}</span></div></div></div>`).join('')}</div></div>`}
        function renderAwards(){const el=document.getElementById('content-awards');if(!allData.awards?.length){el.innerHTML=empty('🏆','No nominees');return}el.innerHTML=`<div class="cards-grid">${allData.awards.map(a=>`<div class="award-card"><div class="card-header">${a.photoUrl?`<img src="${a.photoUrl}" class="award-photo">`:`<div class="award-photo-placeholder">${initials(a.name)}</div>`}<div><div class="award-name">${a.name||''}</div><div class="award-title">${a.jobTitle||''}</div></div></div><div class="award-writeup">"${a.writeup||''}"</div></div>`).join('')}</div>`}
        function renderCommend(){const el=document.getElementById('content-commend');if(!allData.commend?.length){el.innerHTML=empty('🌟','No commendations');return}el.innerHTML=`<div class="cards-grid">${allData.commend.map(c=>`<div class="card commend-card"><div class="card-header">${c.photoUrl?`<img src="${c.photoUrl}" class="card-photo">`:`<div class="card-photo-placeholder">${initials(c.name)}</div>`}<div><div class="card-title">${c.name||''}</div><div class="card-subtitle">${c.jobTitle||''}</div></div></div><div class="card-body">${c.message||''}</div><div class="card-meta"><span>📅 ${fmtDate(c.date)}</span></div></div>`).join('')}</div>`}
        function renderDYK(){const el=document.getElementById('content-dyk');if(!allData.dyk?.length){el.innerHTML=empty('💡','No facts');return}const f=allData.dyk[Math.floor(Math.random()*allData.dyk.length)];el.innerHTML=`<div class="dyk-container"><div class="dyk-icon">💡</div><div class="dyk-text">${f.fact||''}</div>${f.source?`<div class="dyk-source">— ${f.source}</div>`:''}</div>`}
        function empty(i,t){return`<div class="empty-state"><div class="empty-icon">${i}</div><div class="empty-text">${t}</div></div>`}
        function fmtDate(d){return d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'-'}
        function fmtBday(d){return d?new Date(d).toLocaleDateString('en-US',{month:'long',day:'numeric'}):'-'}
        function initials(n){return n?n.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2):'?'}
        function fmt(n){return n?Number(n).toLocaleString():'0'}
        function num(n){return parseFloat(n)||0}
        function money(n,showSign=false){const v=num(n);const s=showSign&&v>0?'+':'';return s+'$'+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}
    </script>
